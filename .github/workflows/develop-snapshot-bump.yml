name: Develop Snapshot Bump

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

jobs:
  bump:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Calculate CalVer snapshot
        id: version
        shell: bash
        run: |
          DESIRED_VERSION="$(date -u +'%y.%-m.%-d')-SNAPSHOT"
          CURRENT_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          echo "desired_version=$DESIRED_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update pom.xml version
        if: steps.version.outputs.current_version != steps.version.outputs.desired_version
        run: |
          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.desired_version }} \
            -DgenerateBackupPoms=false

      - name: Commit and push snapshot bump
        if: steps.version.outputs.current_version != steps.version.outputs.desired_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore: bump snapshot version to ${{ steps.version.outputs.desired_version }}"
          git push origin develop
