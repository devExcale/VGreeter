name: Release & Publish

on:
  pull_request:
    types:
      - closed
    branches:
      - master

jobs:
  prepare:
    if: github.event.pull_request.merged == true && github.head_ref == 'develop'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.bump_version.outputs.version }}

    steps:

      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Remove SNAPSHOT from POM
        id: bump_version
        run: |
          mvn versions:set -DremoveSnapshot=true -DgenerateBackupPoms=false
          NEW_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and Push to Master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release version ${{ steps.bump_version.outputs.version }}"
          git push origin master

      - name: Backmerge and Bump Develop to Next SNAPSHOT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout develop
          git merge master --strategy-option ours -m "chore: sync master release commit back to develop"
          
          mvn build-helper:parse-version versions:set \
            -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion}-SNAPSHOT \
            -DgenerateBackupPoms=false

          git commit -am "chore: bump version to next SNAPSHOT"
          git push origin develop

  package:
    if: github.event.pull_request.merged == true && github.head_ref == 'develop'
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        profile:
          - win-x86-64
          - linux-x86-64
          - linux-aarch64

    steps:

      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package Application (${{ matrix.profile }})
        # Tests are skipped because they already passed in the PR Validation workflow
        run: mvn clean package -DskipTests -P${{ matrix.profile }}

      - name: Copy release jar with profile suffix
        shell: bash
        run: |
          mkdir -p dist
          VERSION='${{ needs.prepare.outputs.version }}'
          JAR_NAME="VGreeter-${VERSION}-${{ matrix.profile }}.jar"
          cp target/*.jar "dist/${JAR_NAME}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: VGreeter-${{ needs.prepare.outputs.version }}-${{ matrix.profile }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    if: github.event.pull_request.merged == true && github.head_ref == 'develop'
    needs: [prepare, package]
    runs-on: ubuntu-latest

    steps:

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release v${{ needs.prepare.outputs.version }}
          files: dist/*.jar
          generate_release_notes: true
